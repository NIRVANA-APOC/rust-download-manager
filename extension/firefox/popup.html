<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RDM 下载接管</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/rdm-32.png" alt="RDM" width="32" height="32" />
      <div class="titles">
        <h1>RDM 下载接管</h1>
        <p id="version" class="subtle">加载中…</p>
      </div>
      <label class="switch" title="开启 / 关闭下载接管">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="card">
      <div class="status-line">
        <span id="host-dot" class="dot unknown"></span>
        <span id="host-text">原生宿主：检测中…</span>
      </div>
      <div class="status-line">
        <span id="gui-dot" class="dot unknown"></span>
        <span id="gui-text">RDM GUI：检测中…</span>
      </div>
      <p id="detail" class="detail"></p>
      <div class="actions">
        <button id="refresh" class="btn" type="button">重新检测</button>
        <button id="options" class="btn" type="button">设置</button>
      </div>
    </section>

    <section id="active-section" class="active-section" hidden>
      <div id="active-head" class="section-head active-head" hidden>
        <h2 id="active-title">正在下载</h2>
        <span id="active-summary" class="active-summary"></span>
      </div>
      <ul id="active-list" class="active-list"></ul>
      <p id="active-more" class="active-more" hidden></p>
      <p id="active-hint" class="active-hint" role="status" aria-live="polite" hidden></p>
    </section>

    <section class="card ai-card" aria-labelledby="ai-title">
      <div class="ai-head">
        <h2 id="ai-title">AI 解析</h2>
        <label
          class="ai-credentials"
          title="勾选后把当前页面 Cookie 发送给本机 RDM（仅内存转发，不写日志/磁盘）；需要登录态的页面解析更准确"
        >
          <input id="ai-credentials" type="checkbox" aria-label="附带 Cookie 凭证" />
          <span>Cookie</span>
        </label>
        <button
          id="ai-parse"
          class="btn primary btn-sm"
          type="button"
          title="解析当前页面（结果在 RDM 桌面端 AI 栏查看）"
          aria-label="AI 解析当前页，结果在 RDM 桌面端 AI 栏查看"
        >
          解析此页
        </button>
      </div>
      <p id="ai-result" class="ai-result" role="status" aria-live="polite"></p>
    </section>

    <section class="recent">
      <div class="section-head">
        <h2>最近转交</h2>
        <button id="clear" class="link" type="button">清空</button>
      </div>
      <ul id="recent-list" class="list">
        <li class="empty">暂无记录</li>
      </ul>
    </section>

    <footer class="foot">
      RDM · 多线程下载器 · 宿主 <span id="host-name">com.rdm.download</span>
    </footer>

    <script src="lib/pure.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
