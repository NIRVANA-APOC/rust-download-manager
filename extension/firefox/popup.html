<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RDM 下载接管</title>
    <link rel="stylesheet" href="lib/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- 头部：品牌 + 弱化状态 + 接管开关 + 设置 -->
    <header class="top">
      <img class="logo" src="icons/rdm-32.png" alt="RDM" width="32" height="32" />
      <div class="titles">
        <h1>RDM</h1>
        <p class="subtitle">
          下载接管
          <span id="chrome-badge" class="chrome-badge" hidden>Chrome 实验性</span>
        </p>
      </div>
      <span class="ready" id="ready">
        <span id="ready-dot" class="dot muted" aria-hidden="true"></span>
        <span id="ready-text">检测中…</span>
      </span>
      <label class="switch" title="开启 / 关闭下载接管">
        <input id="enabled" type="checkbox" aria-label="启用下载接管" />
        <span class="slider" aria-hidden="true"></span>
      </label>
      <button id="settings" class="icon-btn" type="button" title="设置" aria-label="打开设置">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M8 10.2a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Zm5.6-1.4.02-.8-.02-.8 1.28-.98a.5.5 0 0 0 .12-.64l-1.21-2.1a.5.5 0 0 0-.6-.22l-1.5.6a6 6 0 0 0-1.38-.8l-.23-1.6A.5.5 0 0 0 9.6 1H6.4a.5.5 0 0 0-.49.42l-.23 1.6c-.5.2-.96.47-1.38.8l-1.5-.6a.5.5 0 0 0-.6.22l-1.2 2.1a.5.5 0 0 0 .11.64l1.28.98-.02.8.02.8-1.28.98a.5.5 0 0 0-.12.64l1.21 2.1c.13.23.4.32.6.22l1.5-.6c.42.33.88.6 1.38.8l.23 1.6c.04.24.25.42.49.42h3.2c.24 0 .45-.18.49-.42l.23-1.6c.5-.2.96-.47 1.38-.8l1.5.6c.2.1.47 0 .6-.22l1.2-2.1a.5.5 0 0 0-.11-.64l-1.28-.98Z"
          />
        </svg>
      </button>
    </header>

    <!-- 状态条：只在异常时出现（宿主未安装 / GUI 未运行 / 协议错误 / 接管关闭） -->
    <section id="banner" class="banner" role="status" aria-live="polite" hidden>
      <span id="banner-icon" class="banner-icon" aria-hidden="true">!</span>
      <p id="banner-text" class="banner-text"></p>
      <button id="banner-action" class="link-btn" type="button"></button>
    </section>

    <!-- 主操作：全 popup 唯一蓝色主按钮 -->
    <section class="primary-card">
      <button id="primary" class="primary" type="button" aria-describedby="primary-info">
        <span id="primary-icon" class="primary-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="18" height="18" focusable="false">
            <path
              fill="currentColor"
              d="M8 1.5a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V2.25A.75.75 0 0 1 8 1.5ZM2.25 11a.75.75 0 0 1 .75.75v1.5c0 .14.11.25.25.25h9.5c.14 0 .25-.11.25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5c0 .97-.78 1.75-1.75 1.75h-9.5A1.75 1.75 0 0 1 1.5 13.25v-1.5a.75.75 0 0 1 .75-.75Z"
            />
          </svg>
        </span>
        <span id="primary-text" class="primary-text">正在检测…</span>
      </button>
      <p id="primary-info" class="primary-info"></p>
      <p id="primary-result" class="primary-result" role="status" aria-live="polite"></p>
    </section>

    <!-- 正在下载（最多 3 条；无任务时整段隐藏） -->
    <section id="active-section" class="active-section" hidden>
      <div id="active-head" class="section-head">
        <h2 id="active-title" class="section-title">正在下载</h2>
        <span id="active-speed" class="section-note"></span>
        <button id="active-open" class="link-btn" type="button">打开 RDM</button>
      </div>
      <ul id="active-list" class="active-list"></ul>
      <p id="active-more" class="section-note active-more" hidden></p>
      <p id="active-hint" class="hint" role="status" aria-live="polite" hidden></p>
    </section>

    <!-- 最近活动（最多 5 条，可清空并撤销） -->
    <section class="recent" aria-labelledby="recent-title">
      <div class="section-head">
        <h2 id="recent-title" class="section-title">最近活动</h2>
        <button id="recent-clear" class="link-btn" type="button">清空</button>
      </div>
      <ul id="recent-list" class="recent-list"></ul>
      <p id="recent-empty" class="empty">暂无记录</p>
    </section>

    <div id="undo-toast" class="undo-toast" role="status" aria-live="polite" hidden>
      <span id="undo-text">已清空最近活动</span>
      <button id="undo-action" class="foot-link" type="button">撤销</button>
    </div>

    <script src="lib/pure.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
